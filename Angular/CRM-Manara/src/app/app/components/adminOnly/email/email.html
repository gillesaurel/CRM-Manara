<app-main></app-main>
<div class="admin-main email-page">

  <div class="email-card">
    <h1>Envoyer un Email</h1>

    <!-- Message succès -->
    <div *ngIf="message" class="flash-message">
      {{ message }}
    </div>

    <form (ngSubmit)="sendEmail()" class="email-form">

      <!-- TYPE -->
      <label>Envoyer à :</label>
      <select [(ngModel)]="playload.type"
              name="type"
              (change)="onTypeChange()">

        <option value="ALL">Tout le monde</option>
        <option value="PARENT_ALL">Tous les parents</option>
        <option value="ANIMATEUR_ALL">Tous les animateurs</option>
        <option value="PARENT_ONE">Choisir un parent</option>
        <option value="ANIMATEUR_ONE">Choisir un animateur</option>
      </select>

      <!-- Parent -->
      <div *ngIf="playload.type === 'PARENT_ONE'">
        <label>Parent :</label>
        <select [(ngModel)]="playload.parentId" name="parentId">
          <option value="">Sélectionner un parent</option>
          <option *ngFor="let p of parents" [value]="p.id">
            {{ p.nom }} {{ p.prenom }} ({{ p.email }})
          </option>
        </select>
      </div>

      <!-- Animateur -->
      <div *ngIf="playload.type === 'ANIMATEUR_ONE'">
        <label>Animateur :</label>
        <select [(ngModel)]="playload.animateurId" name="animateurId">
          <option value="">Sélectionner un animateur</option>
          <option *ngFor="let a of animateurs" [value]="a.id">
            {{ a.nom }} {{ a.prenom }} ({{ a.email }})
          </option>
        </select>
      </div>

      <!-- Sujet -->
      <label>Sujet :</label>
      <input type="text"
             [(ngModel)]="playload.subject"
             name="subject"
             required>

      <!-- Message -->
      <label>Message :</label>
      <textarea [(ngModel)]="playload.message"
                name="message"
                rows="6"
                required>
      </textarea>

      <!-- Bouton -->
      <button type="submit" class="btn-send">
        <i class="fas fa-paper-plane"></i> Envoyer
      </button>

    </form>
  </div>

</div>

<app-fragment-administrateur></app-fragment-administrateur>
