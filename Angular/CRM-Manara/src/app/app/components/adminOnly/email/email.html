
<div class="admin-main email-page">

  <div class="email-card">
    <h1>Envoyer un Email</h1>

    <!-- Message succès -->
    <div *ngIf="message" class="flash-message">
      {{ message }}
    </div>

    <form (ngSubmit)="sendEmail(frm)" #frm="ngForm" class="email-form">

      <!-- TYPE -->
      <label>Envoyer à :</label>
      <select [(ngModel)]="dataSend.type" name="type" (change)="onTypeChange()">

        <option value="ALL">Tout le monde</option>
        <option value="PARENT_ALL">Tous les parents</option>
        <option value="ANIMATEUR_ALL">Tous les animateurs</option>
        <option value="PARENT_ONE">Choisir un parent</option>
        <option value="ANIMATEUR_ONE">Choisir un animateur</option>
      </select>

      <!-- Parent -->
      <div *ngIf="dataSend.type === 'PARENT_ONE'">
        <label>Parent :</label>
        <select [(ngModel)]="dataSend.parentId" name="parentId">
          <option value="">Sélectionner un parent</option>
          <option *ngFor="let p of parents" [ngValue]="p.id">
            {{ p.nom }} {{ p.prenom }} ({{ p.email }})
          </option>
        </select>
      </div>

      <!-- Animateur -->
      <div *ngIf="dataSend.type === 'ANIMATEUR_ONE'">
        <label>Animateur :</label>
        <select [(ngModel)]="dataSend.animateurId" name="animateurId">
          <option value="">Sélectionner un animateur</option>
          <option *ngFor="let a of animateurs" [ngValue]="a.id">
            {{ a.nom }} {{ a.prenom }} ({{ a.email }})
          </option>
        </select>
      </div>

      <!-- Sujet -->
      <label>Sujet :</label>
      <input type="text" [(ngModel)]="dataSend.subject" name="subject" required>

      <!-- Message -->
      <label>Message :</label>
      <textarea [(ngModel)]="dataSend.message" name="message" rows="6" required>
      </textarea>

      <!-- Bouton -->
      <button type="submit" class="btn-send" [disabled]="frm.invalid">
        <i class="fas fa-paper-plane"></i> Envoyer
      </button>

    </form>
  </div>
  <app-footer></app-footer>
  <div class="bottom-espace"></div>
</div>

<app-fragment-administrateur></app-fragment-administrateur>
