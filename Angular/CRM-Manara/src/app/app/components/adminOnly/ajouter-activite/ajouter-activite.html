
<div class="admin-main">
  <h2>
    {{ activiteForm.id ? 'Modifier une activité' : 'Créer une nouvelle activité' }}
  </h2>

  <div class="alert alert-success text-center" *ngIf="message">
    {{message}}
  </div>

  <div class="form-container">
    <form #f="ngForm" (ngSubmit)="onSubmit()">

      <div class="form-group" style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">Nom de l'activité</label>
        <input type="text" [(ngModel)]="activiteForm.nom" name="nom" required
          style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">Date et Heure</label>
        <input type="datetime-local" [(ngModel)]="activiteForm.dateDebut" name="dateDebut" required
          style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">Capacité</label>
        <input type="number" [(ngModel)]="activiteForm.capacite" name="capacite" min="1" required
          style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px;">Description</label>
        <textarea [(ngModel)]="activiteForm.description" name="description"
          style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; height: 100px;"></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="btn-explorer" [disabled]="!f.valid">
          {{ activiteForm.id ? 'Modifier' : 'Enregistrer' }}
        </button>
        <button type="button" class="btn-annuler" (click)="goBack()">
          Annuler
        </button>
      </div>
    </form>
  </div>
</div>
<app-footer></app-footer>
<div class="bottom-espace"></div>

<app-fragment-administrateur></app-fragment-administrateur>
