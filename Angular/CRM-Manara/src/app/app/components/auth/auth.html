<main class="formulaire-section">
  <div class="form">
    <h1>Connexion</h1>

    <form (ngSubmit)="login()">

      <div *ngIf="error" class="alert alert-danger">
        Courriel ou mot de passe invalide.
      </div>

      <div *ngIf="message" class="alert alert-success">
        {{ message }}
      </div>

      <div>
        <label for="email">Courriel *</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
        />
      </div>

      <div>
        <label for="password">Mot de passe *</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
        />
      </div>

      <div class="btn-group-inscription">
        <button type="submit">Se connecter</button>
        <a routerLink="/register" class="mon-bouton-bleu">Créer un compte</a>
      </div>

    </form>
  </div>
</main>
