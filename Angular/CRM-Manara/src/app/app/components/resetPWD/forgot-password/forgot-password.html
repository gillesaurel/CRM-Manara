<main class="formulaire-section">
  <div class="form">

    <div class="fp-icon">
      <i class="fas fa-lock"></i>
    </div>

    <h1>Mot de passe oublié</h1>
    <p class="fp-desc">Entrez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>

    <div *ngIf="success" class="alert alert-success">
      <i class="fas fa-check-circle"></i>
      {{ success }}
    </div>

    <div *ngIf="error" class="alert alert-danger">
      <i class="fas fa-exclamation-circle"></i>
      {{ error }}
    </div>

    <form (ngSubmit)="submit()" *ngIf="!success">

      <div>
        <label for="email">Adresse email *</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="exemple@email.com"
        />
      </div>

      <div class="btn-group-inscription">
        <button type="submit" [disabled]="loading">
          <span *ngIf="!loading"><i class="fas fa-paper-plane"></i> Envoyer le lien</span>
          <span *ngIf="loading"><i class="fas fa-spinner fa-spin"></i> Envoi en cours...</span>
        </button>
      </div>

    </form>

    <div class="fp-back">
      <a routerLink="/login">
        <i class="fas fa-arrow-left"></i> Retour à la connexion
      </a>
    </div>

  </div>
</main>
