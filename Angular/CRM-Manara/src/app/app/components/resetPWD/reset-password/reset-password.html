<main class="formulaire-section">
  <div class="form">

    <div class="fp-icon fp-icon--success">
      <i class="fas fa-key"></i>
    </div>

    <h1>Nouveau mot de passe</h1>
    <p class="fp-desc">Choisissez un nouveau mot de passe sécurisé d'au moins 8 caractères.</p>

    <!-- TOKEN INVALIDE -->
    <div *ngIf="tokenInvalide" class="alert alert-danger">
      <i class="fas fa-exclamation-circle"></i>
      Ce lien est invalide ou a expiré. <a routerLink="/forgot-password">Faire une nouvelle demande</a>
    </div>

    <!-- SUCCÈS -->
    <div *ngIf="success" class="alert alert-success">
      <i class="fas fa-check-circle"></i>
      {{ success }}
      <br>
      <a routerLink="/login">Se connecter maintenant</a>
    </div>

    <!-- ERREUR -->
    <div *ngIf="error" class="alert alert-danger">
      <i class="fas fa-exclamation-circle"></i>
      {{ error }}
    </div>

    <!-- FORMULAIRE -->
    <form (ngSubmit)="submit()" *ngIf="!success && !tokenInvalide">

      <div>
        <label for="pwd">Nouveau mot de passe *</label>
        <input
          type="password"
          id="pwd"
          name="pwd"
          [(ngModel)]="nouveauMotDePasse"
          required
          minlength="8"
          placeholder="Min. 8 caractères"
        />
      </div>

      <div>
        <label for="confirm">Confirmer le mot de passe *</label>
        <input
          type="password"
          id="confirm"
          name="confirm"
          [(ngModel)]="confirmation"
          required
          minlength="8"
          placeholder="Répétez le mot de passe"
        />
        <small *ngIf="confirmation && nouveauMotDePasse !== confirmation" class="fp-error">
          Les mots de passe ne correspondent pas.
        </small>
      </div>

      <div class="btn-group-inscription">
        <button type="submit"
          [disabled]="loading || nouveauMotDePasse !== confirmation || nouveauMotDePasse.length < 8">
          <span *ngIf="!loading"><i class="fas fa-check"></i> Réinitialiser</span>
          <span *ngIf="loading"><i class="fas fa-spinner fa-spin"></i> En cours...</span>
        </button>
      </div>

    </form>

    <div class="fp-back" *ngIf="!success">
      <a routerLink="/login">
        <i class="fas fa-arrow-left"></i> Retour à la connexion
      </a>
    </div>

  </div>
</main>
