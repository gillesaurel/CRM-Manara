<main class="formulaire-section">
  <div class="form-container">
    <h1>Modifier un enfant</h1>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" #enfantForm="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label for="prenom">Prénom de l'enfant *</label>
          <input type="text" id="prenom" name="prenom" [(ngModel)]="enfant.prenom" 
                 class="form-control" required #prenom="ngModel" />
          <div *ngIf="prenom.invalid && prenom.touched" class="error-message">
            Le prénom est requis
          </div>
        </div>

        <div class="form-group">
          <label for="nom">Nom de l'enfant *</label>
          <input type="text" id="nom" name="nom" [(ngModel)]="enfant.nom" 
                 class="form-control" required #nom="ngModel" />
          <div *ngIf="nom.invalid && nom.touched" class="error-message">
            Le nom est requis
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="dateNaissance">Date de naissance *</label>
        <input type="date" id="dateNaissance" name="dateNaissance" [(ngModel)]="enfant.dateNaissance" 
               class="form-control" required #dateNaissance="ngModel" />
        <div *ngIf="dateNaissance.invalid && dateNaissance.touched" class="error-message">
          La date de naissance est requise
        </div>
      </div>

      <div class="form-group">
        <label for="allergies">Allergies</label>
        <textarea id="allergies" name="allergies" [(ngModel)]="enfant.allergies" 
                  class="form-control" rows="2"></textarea>
      </div>

      <div class="form-group">
        <label for="notesMedicales">Notes médicales</label>
        <textarea id="notesMedicales" name="notesMedicales" [(ngModel)]="enfant.notesMedicales" 
                  class="form-control" rows="3"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="enfantForm.invalid">
          Enregistrer les modifications
        </button>
        <a routerLink="/parent/enfants" class="btn-cancel">Annuler</a>
      </div>
    </form>
  </div>
</main>

<app-parent-nav></app-parent-nav>
