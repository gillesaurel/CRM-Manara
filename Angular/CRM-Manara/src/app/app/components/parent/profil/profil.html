<main class="dashboard-container">
  <div class="page-header">
    <h1>Mon profil</h1>
    <a routerLink="/parent/dashboard" class="btn-back">← Retour au tableau de bord</a>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div class="profile-container">
    <div class="profile-sidebar">
      <div class="profile-avatar">
        <span>{{ (parent?.prenom?.charAt(0) || '') + (parent?.nom?.charAt(0) || '') }}</span>
      </div>
      <h3>{{ parent?.prenom }} {{ parent?.nom }}</h3>
      <p class="profile-email">{{ parent?.email }}</p>
    </div>

    <div class="profile-form">
      <form (ngSubmit)="onSubmit()" #profilForm="ngForm">
        <div class="form-row">
          <div class="form-group">
            <label for="prenom">Prénom *</label>
            <input type="text" id="prenom" name="prenom" [(ngModel)]="parent.prenom" 
                   class="form-control" required #prenom="ngModel" />
            <div *ngIf="prenom.invalid && prenom.touched" class="error-message">
              Le prénom est requis
            </div>
          </div>
          <div class="form-group">
            <label for="nom">Nom *</label>
            <input type="text" id="nom" name="nom" [(ngModel)]="parent.nom" 
                   class="form-control" required #nom="ngModel" />
            <div *ngIf="nom.invalid && nom.touched" class="error-message">
              Le nom est requis
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="parent.email" 
                 class="form-control" readonly disabled />
          <small class="form-text">L'email ne peut pas être modifié</small>
        </div>

        <div class="form-group">
          <label for="telephone">Téléphone</label>
          <input type="tel" id="telephone" name="telephone" [(ngModel)]="parent.telephone" 
                 class="form-control" placeholder="0612345678" pattern="[0-9]{10}" />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-submit" [disabled]="profilForm.invalid">
            Enregistrer les modifications
          </button>
          <a routerLink="/parent/dashboard" class="btn-cancel">Annuler</a>
        </div>
      </form>

    </div>
  </div>
</main>

<app-parent-nav></app-parent-nav>
