spring.application.name=CRM_Manara
# DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url=jdbc:mysql://localhost:3306/crm_manara?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
#spring.datasource.url=jdbc:mysql://localhost:3306/portail?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username=root
spring.datasource.password=root

# Hibernate

#Le dialecte SQL permet à Hibernate de générer un meilleur SQL pour la base de données choisie

#pour trouver la bonne classe de numérotation de la base de données pour Mysql

#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ddl auto (create, create-drop, validate, update)

spring.jpa.hibernate.ddl-auto = update

#pour afficher les instructions sql sur la console

spring.jpa.show-sql=false

#pour rendre les instructions sql plus lisibles sur la console

spring.jpa.properties.hibernate.format_sql=true

# Dossier racine où on stocke toutes les images (uploads + images du site)

# DEV : crée un dossier "images" à la racine du projet

app.images-dir=images
app.upload.dir=uploads

spring.security.user.name=disabled
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration