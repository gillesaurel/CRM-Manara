spring.application.name=CRM_Manara
# DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url=jdbc:mysql://localhost:3306/crm_manara?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
#spring.datasource.url=jdbc:mysql://localhost:3306/portail?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username=root
spring.datasource.password=crosemont

# Hibernate

#Le dialecte SQL permet � Hibernate de g�n�rer un meilleur SQL pour la base de donn�es choisie

#pour trouver la bonne classe de num�rotation de la base de donn�es pour Mysql

#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ddl auto (create, create-drop, validate, update)

spring.jpa.hibernate.ddl-auto = update

#pour afficher les instructions sql sur la console

spring.jpa.show-sql=false

#pour rendre les instructions sql plus lisibles sur la console

spring.jpa.properties.hibernate.format_sql=true

