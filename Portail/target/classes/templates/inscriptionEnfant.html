<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Inscription enfant</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/styleInscriptionEnfant.css}">
  <link th:rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>
<header th:replace="fragments/main::header"></header>
<div class="container">

<h2>Inscrire un enfant à une activité</h2>

<!-- Message de confirmation -->
<div th:if="${message}">
  <p th:text="${message}" style="color: green;"></p>
</div>

<form th:action="@{/admin/inscriptionEnfant/save}" method="post">

  <!-- ENFANT -->
  <label>Nom de l'enfant :</label>
  <input type="text" name="nomEnfant" required>

  <br><br>

  <!-- ACTIVITÉS (MENU DÉROULANT DYNAMIQUE) -->
  <label>Choisir une activité :</label>
  <select name="activiteId" required>
    <option value=""> Sélectionner </option>

    <option th:each="a : ${activites}"
            th:value="${a.id}"
            th:text="${a.nom + ' | Places: ' + a.capacite}">
    </option>

  </select>

  <br><br>

  <button type="submit">Inscrire</button>

</form>
</div>
<footer th:replace="~{fragments/fragmentAdministrateur::bottomNav('users')}"></footer>
<footer th:replace="~{fragments/main::footer}"></footer>
</body>
</html>
