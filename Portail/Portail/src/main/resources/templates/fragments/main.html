<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Manara</title>
</head>
<body>

<!-- HEADER INDEX -->
    <header th:fragment="header">
        <img th:src="@{/images/manara_logo.png}" alt="Logo Manara">

        <nav>
            <a th:href="@{/}">Accueil</a>
            <a th:href="@{/apropos}">À propos</a>

            <!-- Si l'utilisateur est connecté -->
            <div th:if="${#authorization.expression('isAuthenticated()')}" class="user-menu">
                <span th:text="${#authentication.name}"></span>
                <a th:href="@{/parent/dashboard}">Mon espace</a>
                <a th:href="@{/deconnexion}">Déconnexion</a>
            </div>

            <!-- Si l'utilisateur n'est PAS connecté -->
            <div th:unless="${#authorization.expression('isAuthenticated()')}">
                <a th:href="@{/register}">S'inscrire</a>
                <a th:href="@{/login}">Se connecter</a>
            </div>
        </nav>

    </header>

    <!-- HEADER ADMINISTRATEUR
    <header th:fragment="header-admin">
        <img th:src="@{/images/manara_logo.png}" alt="Logo Manara">
        <nav>
            <a th:href="@{/}">Dashboard</a>
            <a th:href="@{/}">Activités</a>

        </nav>
    </header> -->

    <footer th:fragment="footer">
        <p>&copy; 2026 Manara | Tout droit reservé </p>
    </footer>

</body>
</html>
