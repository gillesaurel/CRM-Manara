<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <title>Notifications - Manara</title>
</head>
<body>
<header th:replace="fragments::header"></header>

<main class="dashboard-container">
  <div class="page-header">
    <h1>Centre de notifications</h1>
    <button class="btn-mark-read" onclick="marquerToutLu()">Tout marquer comme lu</button>
  </div>

  <!-- Filtres -->
  <div class="notifications-filters">
    <button class="filter-btn active" data-filter="all">Toutes</button>
    <button class="filter-btn" data-filter="unread">Non lues</button>
    <button class="filter-btn" data-filter="messages">Messages</button>
    <button class="filter-btn" data-filter="updates">Mises à jour</button>
  </div>

  <!-- Liste des notifications -->
  <div class="notifications-list">
    <div th:if="${communications.isEmpty()}" class="empty-state">
      <p>Aucune notification</p>
    </div>

    <div th:unless="${communications.isEmpty()}" class="notifications-container">
      <div class="notification-item" th:each="comm : ${communications}"
           th:classappend="${!comm.lu} ? 'unread' : ''"
           th:attr="data-id=${comm.id}, data-read=${comm.lu}">

        <div class="notification-icon" th:classappend="${!comm.lu} ? 'pulse' : ''">
                        <span th:switch="${comm.canal}">
                            <span th:case="'EMAIL'">📧</span>
                            <span th:case="'SMS'">📱</span>
                            <span th:case="'NOTIFICATION'">🔔</span>
                            <span th:case="*">📨</span>
                        </span>
        </div>

        <div class="notification-content">
          <div class="notification-header">
            <h3 th:text="${comm.sujet}">Sujet de la notification</h3>
            <span class="notification-time"
                  th:text="${#dates.format(comm.dateEnvoi, 'dd/MM/yyyy HH:mm')}">
                                15/01/2024 14:30
                            </span>
          </div>

          <p class="notification-message" th:text="${comm.message}">
            Contenu du message...
          </p>

          <div class="notification-footer">
            <span class="notification-type" th:text="${comm.canal}">Email</span>
            <button th:if="${!comm.lu}" class="btn-mark-one"
                    th:attr="onclick='marquerLu(' + ${comm.id} + ')'">
              Marquer comme lu
            </button>
          </div>
        </div>

        <span th:if="${!comm.lu}" class="unread-badge">Nouveau</span>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination">
    <button class="page-btn" disabled>Précédent</button>
    <span class="page-info">Page 1 sur 3</span>
    <button class="page-btn">Suivant</button>
  </div>
</main>

<footer th:replace="fragments::footer"></footer>

<script>
  function marquerLu(id) {
      fetch('/parent/notifications/' + id + '/read', {
          method: 'POST',
          headers: {
              'X-CSRF-TOKEN': '[[${_csrf.token}]]'
          }
      }).then(() => {
          location.reload();
      });
  }

  function marquerToutLu() {
      fetch('/parent/notifications/read-all', {
          method: 'POST',
          headers: {
              'X-CSRF-TOKEN': '[[${_csrf.token}]]'
          }
      }).then(() => {
          location.reload();
      });
  }

  // Filtres
  document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');

          const filter = this.dataset.filter;
          const notifications = document.querySelectorAll('.notification-item');

          notifications.forEach(n => {
              if (filter === 'all') n.style.display = 'flex';
              else if (filter === 'unread') {
                  n.style.display = n.dataset.read === 'false' ? 'flex' : 'none';
              }
          });
      });
  });
</script>
</body>
</html>
