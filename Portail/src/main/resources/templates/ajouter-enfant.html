<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Ajouter un enfant - Manara</title>
</head>
<body>
<header th:replace="fragments::header"></header>

<main class="formulaire-section">
    <div class="form-container">
        <h1>Ajouter un enfant</h1>

        <form th:action="@{/parent/enfants/ajouter}" th:object="${enfant}" method="post">
            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

            <div class="form-row">
                <div class="form-group" th:classappend="${#fields.hasErrors('prenom')} ? 'has-error' : ''">
                    <label for="prenom">Prénom de l'enfant *</label>
                    <input type="text" id="prenom" th:field="*{prenom}" class="form-control" required />
                    <div th:if="${#fields.hasErrors('prenom')}" class="error-message" th:errors="*{prenom}"></div>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('nom')} ? 'has-error' : ''">
                    <label for="nom">Nom de l'enfant *</label>
                    <input type="text" id="nom" th:field="*{nom}" class="form-control" required />
                    <div th:if="${#fields.hasErrors('nom')}" class="error-message" th:errors="*{nom}"></div>
                </div>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('dateNaissance')} ? 'has-error' : ''">
                <label for="dateNaissance">Date de naissance *</label>
                <input type="date" id="dateNaissance" th:field="*{dateNaissance}" class="form-control" required />
                <div th:if="${#fields.hasErrors('dateNaissance')}" class="error-message" th:errors="*{dateNaissance}"></div>
            </div>

            <div class="form-group">
                <label for="allergies">Allergies (optionnel)</label>
                <textarea id="allergies" th:field="*{allergies}" class="form-control"
                          rows="2" placeholder="Listez les allergies éventuelles..."></textarea>
            </div>

            <div class="form-group">
                <label for="notesMedicales">Notes médicales (optionnel)</label>
                <textarea id="notesMedicales" th:field="*{notesMedicales}" class="form-control"
                          rows="3" placeholder="Informations médicales importantes..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Ajouter l'enfant</button>
                <a th:href="@{/parent/enfants}" class="btn-cancel">Annuler</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="fragments::footer"></footer>
</body>
</html>
