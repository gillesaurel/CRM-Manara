<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <link th:rel="stylesheet" th:href="@{/css/style.css}">
    <title>Connexion</title>
</head>
<body>
    <header th:replace="~{fragments/main::header}">

    </header>
    <main class="formulaire-section">
        <div class="form">
            <h1>Connexion</h1>

            <form th:action="@{/login}" method="post">
                <!-- Messages d'erreur -->
                <div th:if="${param.error}" class="alert alert-danger">
                    Courriel ou mot de passe invalide.
                </div>
                <div th:if="${message != null}" class="alert alert-success">
                    [[${message}]]
                </div>

                <!-- Courriel -->
                <div>
                    <label for="email">Courriel *</label>
                    <input type="email"
                        id="email"
                        name="username"
                        placeholder="pierre@gmail.com"
                        required />
                </div>

                <!-- Mot de passe -->
                <div>
                    <label for="password">Mot de passe *</label>
                    <input type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        minlength="6" />
                </div>

                <div class="btn-group-inscription">
                    <button type="submit">Se connecter</button>
                    <a th:href="@{/register}">Créer un compte</a>
                </div>
            </form>
        </div>
    </main>


    <footer th:replace="~{fragments/main::footer}">

    </footer>


</body>
</html>
