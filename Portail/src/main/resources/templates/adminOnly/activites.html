<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Activités et Inscriptions</title>
    <link rel="stylesheet" th:href="@{/css/adminOnlyActivites.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<div class="admin-main">
    <header th:replace="fragments/main::header"></header>

    <h1>Gestion des Activités et Inscriptions</h1>

    <!-- Flash messages -->
    <div th:if="${message}" class="flash-message flash-success" th:text="${message}"></div>
    <div th:if="${error}" class="flash-message flash-error" th:text="${error}"></div>

    <!-- Boutons d'action -->
    <div class="admin-actions">
        <a th:href="@{/admin/administrateur}" class="btn btn-primary">Créer une activité</a>
        <a th:href="@{/admin/inscriptionEnfant}" class="btn btn-secondary">Ajouter un enfant</a>
    </div>

    <hr>

    <!-- Liste des activités -->
    <div th:each="act : ${activites}" class="activite-card">
        <div class="activite-header">
            <h2 th:text="${act.nom}">Nom activité</h2>
            <div class="activite-actions">
                <!-- Modifier -->
                <a th:href="@{/admin/activities/edit/{id}(id=${act.id})}"
                   style="color: #4169E1; margin-right: 10px;"
                   title="Modifier">
                    <i class="fas fa-edit"></i>
                </a>

                <!-- Supprimer -->
                <a th:href="@{/admin/activities/delete/{id}(id=${act.id})}"
                   style="color:#ff0808;"
                   onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette activité ?')"
                   title="Supprimer">
                    <i class="fas fa-trash"></i>
                </a>
            </div>
        </div>

        <p>
            <strong>Date :</strong> <span th:text="${#temporals.format(act.dateDebut, 'dd/MM/yyyy HH:mm')}"></span> |
            <strong>Capacité :</strong> <span th:text="${act.capacite}"></span> |
            <strong>Inscrits :</strong> <span th:text="${act.nbInscrits}"></span> |
            <strong>Liste d'attente :</strong> <span th:text="${act.nbEnAttente}"></span> |
            <strong>Taux remplissage :</strong> <span th:text="${act.tauxRemplissage} + '%'"></span>
        </p>

        <!-- Tableau des inscriptions -->
        <table class="inscriptions-table">
            <thead>
            <tr>
                <th>Nom enfant</th>
                <th>Parent</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ins : ${act.inscriptions}">
                <td th:text="${ins.nomEnfant}">Nom enfant</td>
                <td th:text="${ins.utilisateur.nom}">Parent</td>
                <td th:text="${ins.enAttente} ? 'Liste d’attente' : 'Inscrit'"></td>
                <td>
                    <form th:if="${ins.enAttente}" th:action="@{/admin/inscriptions/valider/{id}(id=${ins.id})}" method="post" style="display:inline-block;">
                        <button type="submit" class="btn btn-small btn-validate">Valider</button>
                    </form>
                    <a th:href="@{/admin/inscriptions/delete/{id}(id=${ins.id})}" class="btn btn-small btn-delete" onclick="return confirm('Supprimer cette inscription ?');">Supprimer</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>

<footer th:replace="~{fragments/fragmentAdministrateur::bottomNav('users')}"></footer>
<footer th:replace="~{fragments/main::footer}"></footer>

</html>
