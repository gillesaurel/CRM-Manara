<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <link th:rel="stylesheet" th:href="@{/css/style.css}">
    <title>Inscription</title>
</head>
<body>

    <header th:replace="fragments/main::header">

    </header>

    <main class="formulaire-section">
        <div class="form">
            <h1>Inscrivez-vous</h1>
            <form th:action="@{/register/save}" th:object="${utilisateur}" method="post" >
                <span class="error" > </span>
                <div  th:if="${message!= null}">[[${message}]]</div>
                <!-- Nom -->
                <div>
                    <label for="prenom">Prénom *</label>
                    <input type="text"
                           id="prenom"
                           th:field="*{prenom}"
                           placeholder="Jean"
                           required />
                </div>

                <!-- Prénom -->
                <div>
                    <label for="nom">Nom *</label>
                    <input type="text"
                           id="nom"
                           th:field="*{nom}"
                           placeholder="Dupont"
                           required />
                </div>

                <!-- Téléphone -->
                <div>
                    <label for="telephone">Téléphone</label>
                    <input type="tel"
                           id="telephone"
                           th:field="*{telephone}"
                           placeholder="0612345678" />
                </div>

                <!-- Email -->
                <div>
                    <label for="email">Courriel *</label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="jeandupont@gmail.com"
                           required />
                </div>

                <!-- Mot de passe -->
                <div>
                    <label for="motdepasse">Mot de passe *</label>
                    <input type="password"
                           id="motdepasse"
                           th:field="*{motdepasse}"
                           placeholder="••••••••"
                           required
                           minlength="8" />
                </div>


                <!-- Photo
                <div>
                    <label for="photo">Photo de profil</label>
                    <input type="file"
                           id="photo"
                           name="fileImage"
                           accept="image/*" />
                </div>
                -->
                <!-- Boutons -->
                <div class="btn-group-inscription">
                    <button type="submit">S'inscrire</button>
                    <a th:href="@{/login}">Déjà un compte ?</a>
                </div>
            </form>
        </div>
    </main>


    <footer th:replace="fragments/main::footer">

    </footer>

</body>
</html>
