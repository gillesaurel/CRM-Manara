<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link th:rel="stylesheet" th:href="@{/css/style.css}">
    <title>Inscription</title>
</head>
<body>

    <header th:replace="fragments::header">

    </header>

    <main class="formulaire-section">
        <h1>Inscrivez-vous</h1>
        <form >
            <!-- Nom -->
            <div>
                <label for="prenom">Prénom *</label>
                <input type="text"
                       id="prenom"
                       name="prenom"
                       placeholder="Jean"
                       required />
            </div>

            <!-- Prénom -->
            <div>
                <label for="nom">Nom *</label>
                <input type="text"
                       id="nom"
                       name="nom"
                       placeholder="Dupont"
                       required />
            </div>

            <!-- Téléphone -->
            <div>
                <label for="telephone">Téléphone</label>
                <input type="tel"
                       id="telephone"
                       name="telephone"
                       placeholder="0612345678" />
            </div>

            <!-- Email -->
            <div>
                <label for="email">Courriel *</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="jeandupont@gmail.com"
                       required />
            </div>

            <!-- Mot de passe -->
            <div>
                <label for="password">Mot de passe *</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="••••••••"
                       required
                       minlength="8" />
            </div>

            <!-- Photo -->
            <div>
                <label for="photo">Photo de profil</label>
                <input type="file"
                       id="photo"
                       name="photo"
                       accept="image/*" />
            </div>

            <!-- Boutons -->
            <div class="btn-group-inscription">
                <button type="submit" disabled>S'inscrire</button>
                <a th:href="@{/connexion}">Déjà un compte ?</a>
            </div>
        </form>
    </main>


    <footer th:replace="fragments::footer">

    </footer>

</body>
</html>
