<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Planning - Manara</title>
</head>
<body>
<header th:replace="fragments::header"></header>

<main class="dashboard-container">
    <div class="page-header">
        <h1>Planning des activités</h1>
        <div class="planning-nav">
            <button id="prevWeek" class="btn-nav">← Semaine précédente</button>
            <span id="currentWeek" class="current-week">Semaine du 15 au 21 janvier</span>
            <button id="nextWeek" class="btn-nav">Semaine suivante →</button>
        </div>
    </div>

    <div th:if="${inscriptions.isEmpty()}" class="empty-state">
        <p>Aucune activité planifiée</p>
        <a th:href="@{/parent/activites}" class="btn-primary">Inscrire mes enfants</a>
    </div>

    <div th:unless="${inscriptions.isEmpty()}" class="planning-container">
        <!-- Légende -->
        <div class="planning-legend">
            <span class="legend-item"><span class="color-dot" style="background: #043d5b;"></span> Enfant 1</span>
            <span class="legend-item"><span class="color-dot" style="background: #fccd2c;"></span> Enfant 2</span>
        </div>

        <!-- Planning grille -->
        <div class="planning-grid" id="planningGrid">
            <!-- En-tête des jours -->
            <div class="grid-header">
                <div class="time-column"></div>
                <div class="day-column" th:each="i : ${#numbers.sequence(0,6)}">
                    <span class="day-name" th:text="${#dates.format(#dates.createNow().plusDays(i), 'EEEE')}">Lundi</span>
                    <span class="day-number" th:text="${#dates.format(#dates.createNow().plusDays(i), 'dd')}">15</span>
                </div>
            </div>

            <!-- Lignes horaires -->
            <div class="grid-body">
                <div class="time-slot" th:each="hour : ${#numbers.sequence(8, 19)}">
                    <div class="time-label" th:text="${hour} + 'h'">8h</div>
                    <div class="day-slots">
                        <div class="day-slot" th:each="i : ${#numbers.sequence(0,6)}"
                             th:attr="data-day=${i}, data-hour=${hour}">

                            <!-- Afficher les activités programmées -->
                            <div class="planning-event"
                                 th:each="inscription : ${inscriptions}"
                                 th:if="${#dates.format(inscription.session.date, 'yyyy-MM-dd') == #dates.format(#dates.createNow().plusDays(i), 'yyyy-MM-dd')
                                             and inscription.session.heureDebut.getHour() <= hour
                                             and inscription.session.heureFin.getHour() > hour}"
                                 th:style="'background: ' + (${inscription.enfant.id % 2 == 0} ? '#043d5b' : '#fccd2c')">

                                <span class="event-time" th:text="${inscription.session.heureDebut} + '-' + ${inscription.session.heureFin}">10h-11h</span>
                                <span class="event-name" th:text="${inscription.session.activite.nom}">Natation</span>
                                <span class="event-child" th:text="${inscription.enfant.prenom}">Léo</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vue liste alternative -->
    <div class="planning-list-view mt-4">
        <h2>Vue liste</h2>
        <div class="planning-items">
            <div class="planning-item" th:each="inscription : ${inscriptions}">
                <div class="item-date" th:text="${#dates.format(inscription.session.date, 'EEEE dd MMMM')}">
                    Lundi 15 janvier
                </div>
                <div class="item-details">
                    <span class="item-child" th:text="${inscription.enfant.prenom}">Léo</span>
                    <span class="item-activity" th:text="${inscription.session.activite.nom}">Natation</span>
                    <span class="item-time" th:text="${inscription.session.heureDebut} + ' - ' + ${inscription.session.heureFin}">
                            10h - 11h
                        </span>
                    <span class="item-location" th:text="${inscription.session.lieu}">Piscine</span>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments::footer"></footer>

<script>
    // Fonctionnalité de navigation par semaine (à implémenter)
    document.getElementById('prevWeek').addEventListener('click', function() {
        // Charger la semaine précédente
    });

    document.getElementById('nextWeek').addEventListener('click', function() {
        // Charger la semaine suivante
    });
</script>
</body>
</html>
