<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <title>Activités - Manara</title>
</head>
<body>

<header th:replace="fragments/main::header"></header>

<main class="dashboard-container">
  <div class="page-header">
    <h1>Activités disponibles</h1>
    <p class="page-subtitle">Découvrez toutes nos activités gratuites pour enfants</p>
  </div>

  <div class="filters-bar">
    <select class="filter-select">
      <option value="">Tous les âges</option>
      <option value="0-3">0-3 ans</option>
      <option value="3-6">3-6 ans</option>
      <option value="6-9">6-9 ans</option>
      <option value="9-12">9-12 ans</option>
    </select>
    <input type="text" class="filter-search" placeholder="Rechercher une activité...">
  </div>

  <div class="info-message">
    <span class="info-icon">🎉</span>
    <p>Toutes nos activités sont entièrement gratuites !</p>
  </div>

  <div th:if="${activites.isEmpty()}" class="empty-state">
    <p>Aucune activité disponible pour le moment</p>
  </div>

  <div th:unless="${activites.isEmpty()}" class="activites-grid-large">
    <div class="activite-card-large" th:each="activite : ${activites}">
      <div class="activite-image" th:style="'background-image: url(' + @{/images/activite-default.png} + ')'">
        <span class="activite-age" th:text="${activite.ageMin} + '-' + ${activite.ageMax} + ' ans'">3-6 ans</span>
      </div>
      <div class="activite-content">
        <h3 th:text="${activite.nom}">Natation</h3>
        <p class="activite-description" th:text="${activite.description}">Description de l'activité</p>
        <div class="activite-meta">
          <span class="activite-gratuit">✨ Gratuit</span>
          <span class="activite-sessions" th:text="${activite.sessions.size()} + ' sessions'">5 sessions</span>
        </div>
        <a th:href="@{/parent/activites/{id}/sessions(id=${activite.id})}" class="btn-primary">Voir les sessions</a>
      </div>
    </div>
  </div>
</main>

<footer th:replace="fragments/main::footer"></footer>

</body>
</html>
