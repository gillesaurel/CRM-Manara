<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <title>Mes enfants - Manara</title>
</head>
<body>

<header th:replace="fragments/main::header"></header>

<main class="dashboard-container">
  <div class="page-header">
    <h1>Mes enfants</h1>
    <a th:href="@{/parent/enfants/ajouter}" class="btn-add">+ Ajouter un enfant</a>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div th:if="${enfants.isEmpty()}" class="empty-state">
    <div class="empty-icon">👶</div>
    <h2>Aucun enfant enregistré</h2>
    <p>Commencez par ajouter vos enfants pour pouvoir les inscrire aux activités.</p>
    <a th:href="@{/parent/enfants/ajouter}" class="btn-primary">Ajouter un enfant</a>
  </div>

  <div th:unless="${enfants.isEmpty()}" class="enfants-grid">
    <div class="enfant-card-large" th:each="enfant : ${enfants}">
      <div class="enfant-header">
        <div class="enfant-avatar-large">
          <span th:text="${enfant.prenom.substring(0,1)} + ${enfant.nom.substring(0,1)}">JD</span>
        </div>
        <div class="enfant-titre">
          <h2 th:text="${enfant.prenom} + ' ' + ${enfant.nom}">Jean Dupont</h2>
          <p class="enfant-age" th:text="${#temporals.format(enfant.dateNaissance, 'dd/MM/yyyy')}">01/01/2020</p>
        </div>
      </div>

      <div class="enfant-details">
        <div th:if="${enfant.allergies}" class="info-badge warning">
          <strong>⚠️ Allergies:</strong> <span th:text="${enfant.allergies}"></span>
        </div>
        <div th:if="${enfant.notesMedicales}" class="info-badge info">
          <strong>📋 Notes médicales:</strong> <span th:text="${enfant.notesMedicales}"></span>
        </div>
      </div>

      <div class="enfant-stats">
        <div class="stat-mini">
          <span class="stat-value" th:text="${enfant.inscriptions.size()}">0</span>
          <span class="stat-label">Inscriptions</span>
        </div>
        <div class="stat-mini">
          <span class="stat-value" th:text="${enfant.presences.size()}">0</span>
          <span class="stat-label">Présences</span>
        </div>
      </div>

      <div class="enfant-actions">
        <a th:href="@{/parent/enfants/{id}(id=${enfant.id})}" class="btn-action view">Voir détails</a>
        <a th:href="@{/parent/enfants/modifier/{id}(id=${enfant.id})}" class="btn-action edit">Modifier</a>
        <a th:href="@{/parent/enfants/supprimer/{id}(id=${enfant.id})}" class="btn-action delete" onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet enfant ?')">Supprimer</a>
      </div>
    </div>
  </div>
</main>

<footer th:replace="fragments/main::footer"></footer>

</body>
</html>
