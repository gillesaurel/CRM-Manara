<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <title>Modifier un enfant - Manara</title>
</head>
<body>

<header th:replace="fragments/main::header"></header>

<main class="formulaire-section">
  <div class="form-container">
    <h1>Modifier un enfant</h1>

    <form th:action="@{/parent/enfants/modifier/{id}(id=${enfant.id})}" th:object="${enfant}" method="post">
      <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

      <div class="form-row">
        <div class="form-group">
          <label for="prenom">Prénom de l'enfant *</label>
          <input type="text" id="prenom" th:field="*{prenom}" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="nom">Nom de l'enfant *</label>
          <input type="text" id="nom" th:field="*{nom}" class="form-control" required />
        </div>
      </div>

      <div class="form-group">
        <label for="dateNaissance">Date de naissance *</label>
        <input type="date" id="dateNaissance" th:field="*{dateNaissance}" class="form-control" required />
      </div>

      <div class="form-group">
        <label for="allergies">Allergies</label>
        <textarea id="allergies" th:field="*{allergies}" class="form-control" rows="2"></textarea>
      </div>

      <div class="form-group">
        <label for="notesMedicales">Notes médicales</label>
        <textarea id="notesMedicales" th:field="*{notesMedicales}" class="form-control" rows="3"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Enregistrer les modifications</button>
        <a th:href="@{/parent/enfants}" class="btn-cancel">Annuler</a>
      </div>
    </form>
  </div>
</main>

<footer th:replace="fragments/main::footer"></footer>

</body>
</html>
