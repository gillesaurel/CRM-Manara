<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <title>Mon profil - Manara</title>
</head>
<body>

<header th:replace="fragments/main::header"></header>

<main class="dashboard-container">
  <div class="page-header">
    <h1>Mon profil</h1>
    <a th:href="@{/parent/dashboard}" class="btn-back">← Retour au tableau de bord</a>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="profile-container">
    <div class="profile-sidebar">
      <div class="profile-avatar">
        <span th:text="${parent.prenom.substring(0,1)} + ${parent.nom.substring(0,1)}">JD</span>
      </div>
      <h3 th:text="${parent.prenom} + ' ' + ${parent.nom}">Jean Dupont</h3>
      <p class="profile-email" th:text="${parent.email}">jean@email.com</p>
    </div>

    <div class="profile-form">
      <form th:action="@{/parent/profil/update}" th:object="${parent}" method="post">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

        <div class="form-row">
          <div class="form-group">
            <label for="prenom">Prénom *</label>
            <input type="text" id="prenom" th:field="*{prenom}" class="form-control" required />
          </div>
          <div class="form-group">
            <label for="nom">Nom *</label>
            <input type="text" id="nom" th:field="*{nom}" class="form-control" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" th:field="*{email}" class="form-control" readonly disabled />
          <small class="form-text">L'email ne peut pas être modifié</small>
        </div>

        <div class="form-group">
          <label for="telephone">Téléphone</label>
          <input type="tel" id="telephone" th:field="*{telephone}" class="form-control" placeholder="0612345678" pattern="[0-9]{10}" />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-submit">Enregistrer les modifications</button>
          <a th:href="@{/parent/dashboard}" class="btn-cancel">Annuler</a>
        </div>
      </form>

      <div class="password-section">
        <h3>Changer de mot de passe</h3>
        <form th:action="@{/parent/profil/change-password}" method="post">
          <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

          <div class="form-group">
            <label for="ancienMotDePasse">Ancien mot de passe</label>
            <input type="password" id="ancienMotDePasse" name="ancienMotDePasse" class="form-control" required />
          </div>

          <div class="form-group">
            <label for="nouveauMotDePasse">Nouveau mot de passe</label>
            <input type="password" id="nouveauMotDePasse" name="nouveauMotDePasse" class="form-control" required minlength="8" />
          </div>

          <div class="form-group">
            <label for="confirmMotDePasse">Confirmer le mot de passe</label>
            <input type="password" id="confirmMotDePasse" name="confirmMotDePasse" class="form-control" required />
          </div>

          <button type="submit" class="btn-submit">Changer le mot de passe</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer th:replace="fragments/main::footer"></footer>

<script>
  document.addEventListener('DOMContentLoaded', function() {
      const nouveau = document.getElementById('nouveauMotDePasse');
      const confirm = document.getElementById('confirmMotDePasse');
      function validatePassword() {
          if (nouveau.value !== confirm.value) {
              confirm.setCustomValidity('Les mots de passe ne correspondent pas');
          } else {
              confirm.setCustomValidity('');
          }
      }
      nouveau.addEventListener('change', validatePassword);
      confirm.addEventListener('keyup', validatePassword);
  });
</script>

</body>
</html>
