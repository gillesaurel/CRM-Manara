<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav class="bottom-nav"
     aria-label="Navigation bas"
     th:fragment="bottomNav(activePage)">

    <a th:href="@{/administrateur/dashboard}"
       th:classappend="${activePage == 'dashboard'} ? 'active'"
       class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Accueil</span>
    </a>

    <a th:href="@{/administrateur/activites}"
       th:classappend="${activePage == 'activites'} ? 'active'"
       class="nav-item">
        <i class="fa-solid fa-layer-group"></i>
        <span>Activités</span>
    </a>

    <a th:href="@{/administrateur/inscriptions}"
       th:classappend="${activePage == 'inscriptions'} ? 'active'"
       class="nav-item">
        <i class="fa-solid fa-user-check"></i>
        <span>Inscriptions</span>
    </a>

    <a th:href="@{/administrateur/messages}"
       th:classappend="${activePage == 'messages'} ? 'active'"
       class="nav-item">
        <i class="fa-solid fa-envelope"></i>
        <span>Messages</span>
    </a>

</nav>

</body>
</html>
