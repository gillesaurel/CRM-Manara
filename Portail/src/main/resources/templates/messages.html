<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <title>Messages - Manara</title>
</head>
<body>
<header th:replace="fragments::header"></header>

<main class="dashboard-container">
  <div class="page-header">
    <h1>Boîte de messages</h1>
    <a th:href="@{/parent/messages/nouveau}" class="btn-add">+ Nouveau message</a>
  </div>

  <div class="messages-container">
    <!-- Sidebar conversations -->
    <div class="conversations-sidebar">
      <div class="conversations-search">
        <input type="text" placeholder="Rechercher..." class="search-input">
      </div>

      <div class="conversations-list">
        <div class="conversation-item active">
          <div class="conv-avatar">M</div>
          <div class="conv-info">
            <h4>Manara Admin</h4>
            <p class="conv-preview">Votre inscription a été confirmée...</p>
            <span class="conv-time">14:30</span>
          </div>
          <span class="unread-count">2</span>
        </div>

        <div class="conversation-item">
          <div class="conv-avatar">A</div>
          <div class="conv-info">
            <h4>Activités</h4>
            <p class="conv-preview">Nouvelle session disponible...</p>
            <span class="conv-time">Hier</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Zone de conversation -->
    <div class="conversation-area">
      <div class="conversation-header">
        <h2>Manara Admin</h2>
        <span class="online-status">En ligne</span>
      </div>

      <div class="messages-list">
        <div class="message received">
          <div class="message-content">
            <p>Bonjour, votre inscription à la natation a été confirmée.</p>
            <span class="message-time">14:30</span>
          </div>
        </div>

        <div class="message sent">
          <div class="message-content">
            <p>Merci beaucoup !</p>
            <span class="message-time">14:35</span>
          </div>
        </div>
      </div>

      <div class="message-input">
        <textarea placeholder="Écrivez votre message..." rows="2"></textarea>
        <button class="btn-send">Envoyer</button>
      </div>
    </div>
  </div>
</main>

<footer th:replace="fragments::footer"></footer>
</body>
</html>
