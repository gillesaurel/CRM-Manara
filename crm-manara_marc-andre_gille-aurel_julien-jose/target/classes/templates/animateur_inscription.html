<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portail Manara — Animateur Inscription</title>

  <link th:rel="stylesheet" th:href="@{/css/style.css}">
  <link th:rel="stylesheet" th:href="@{/css/animateur.css}">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="page-animateurs">

<header th:replace="fragments/main::header"></header>

<main class="dash">

  <section class="dash-top">
    <div>
      <h1>Portail Manara</h1>
      <p class="subtitle">Tableau de bord</p>
    </div>
    <div class="profile-pill">
      <i class="fa-solid fa-user-tie"></i>
      <span>Profil : Animateur</span>
    </div>
  </section>

  <h2>Inscriptions</h2>
  <p>Consulter les listes d'inscrits par activité.</p>

  <div th:each="entry : ${inscriptionsParActivite}">
    <section class="card welcome">
      <h3 th:text="${entry.key}">Nom Activité</h3>
      <div class="quick-grid">
        <table>
          <thead>
          <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>En attente</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="inscription : ${entry.value}">
            <td th:text="${inscription.enfant != null ? inscription.enfant.nom : inscription.nomEnfant}">Nom</td>
            <td th:text="${inscription.enfant != null ? inscription.enfant.prenom : ''}">Prénom</td>
            <td th:text="${inscription.enAttente ? 'Oui' : 'Non'}">Statut</td>
          </tr>
          <tr th:if="${#lists.isEmpty(entry.value)}">
            <td colspan="3">Aucune inscription pour cette activité</td>
          </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <div th:if="${#maps.isEmpty(inscriptionsParActivite)}">
    <section class="card welcome">
      <p>Aucune inscription trouvée.</p>
    </section>
  </div>

  <div class="bottom-spacer"></div>
</main>

<div th:replace="~{fragments/animateur :: bottomNav('dashboard')}"></div>

</body>
</html>
