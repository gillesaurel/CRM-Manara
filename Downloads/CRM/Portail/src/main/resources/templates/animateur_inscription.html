<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portail Manara — Animateur Inscription</title>

    <link th:rel="stylesheet" th:href="@{/css/style.css}">
    <link th:rel="stylesheet" th:href="@{/css/animateur.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="page-animateurs">

<header th:replace="fragments/main::header"></header>

<main class="dash">
    <!-- Titre + petit badge profil -->
    <section class="dash-top">
        <div>
            <h1>Portail Manara</h1>
            <p class="subtitle">Tableau de bord</p>
        </div>

        <div class="profile-pill">
            <i class="fa-solid fa-user-tie"></i>
            <span>Profil : Animateur</span>
        </div>
    </section>

    <!-- Carte Tableau -->
    <section class="card welcome">
        <h2>Inscriptions</h2>
        <p>
            Consulter les listes d’inscrits.
        </p>
        <div class="quick-grid">
            <table>
                <thead>
                <tr>
                    <th>Nom</th>
                    <th>Age</th>
                    <th>Attendance</th>
                </tr>
                </thead>
                <tbody>
                <!-- Loop through the "enfant" attribute from your model -->
                <tr th:each="u : ${enfant}">
                    <!-- Access properties of the Utilisateur object -->
                    <td th:text="${u.nom}">Nom</td>
                    <td >0</td>
                    <!-- Example: If attendance is a boolean, show 'Oui'/'Non' -->
                    <td     >Non</td>
                </tr>
                </tbody>
            </table>

        </div>
    </section>

    <!-- espace pour que la nav bottom ne cache pas le contenu -->
    <div class="bottom-spacer"></div>
</main>

<div th:replace="~{fragments/animateur :: bottomNav('dashboard')}"></div>

</body>
</html>
